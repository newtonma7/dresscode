<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Renderer browser regressions</title>
<body>
<pre id="results">Running renderer regressions</pre>
<script type="module">
import * as THREE from 'three';
import { createRenderer } from '/src/render.js';
import { fitTorso } from '/src/geometry.js';
import { defaultTailoring } from '/src/tailoring.js';

const results = document.getElementById('results');
const checks = [];
const assert = (condition, message) => {
  if (!condition) throw new Error(message);
  checks.push(message);
};
const canvas = () => Object.assign(document.createElement('canvas'), { width: 600, height: 800 });
let renderer;
try {
  const base = canvas();
  const garment = canvas();
  const foreground = canvas();
  document.body.append(base, garment, foreground);
  renderer = createRenderer({ base, garment, foreground });
  renderer.setEnabled(false);
  renderer.setEnabled(true);
  renderer.setSegmentation(false);
  renderer.setSegmentation(true);
  assert(true, 'Toggles before any frame do not throw');

  const source = canvas();
  const sourceContext = source.getContext('2d');
  sourceContext.fillStyle = '#c99373';
  sourceContext.fillRect(0, 0, 600, 800);
  const landmarks = Array.from({ length: 33 }, () => ({ x: 0.5, y: 0.5, visibility: 0 }));
  for (const [index, x, y] of [[11, .32, .32], [12, .68, .32], [13, .24, .49], [14, .76, .49], [15, .21, .70], [16, .79, .70], [23, .35, .78], [24, .65, .78]]) {
    landmarks[index] = { x, y, visibility: 1 };
  }
  const torso = fitTorso(landmarks, source);
  sourceContext.fillStyle = '#ff0000';
  sourceContext.fillRect(138, 460, 1, 1);
  const bitmap = await createImageBitmap(source);
  let closed = 0;
  const close = bitmap.close.bind(bitmap);
  bitmap.close = () => { closed++; close(); };
  const sampleCanvas = canvas();
  const sampleContext = sampleCanvas.getContext('2d');
  const sample = (x, y, layer = garment) => {
    sampleContext.clearRect(0, 0, 600, 800);
    sampleContext.drawImage(layer, 0, 0, 600, 800);
    return sampleContext.getImageData(x, y, 1, 1).data;
  };
  let view;
  const beforeRender = THREE.Object3D.prototype.onBeforeRender;
  THREE.Object3D.prototype.onBeforeRender = function (gl, scene, camera) {
    if (this.isMesh) view = { gl, scene, camera, mesh: this };
    return beforeRender.apply(this, arguments);
  };
  try { renderer.render({ bitmap, torso }); }
  finally { THREE.Object3D.prototype.onBeforeRender = beforeRender; }
  assert(sample(210, 450)[3] > 200 && sample(390, 450)[3] > 200, 'Shirt covers both torso edges below the sleeves');
  assert(sample(300, 260)[3] === 0, 'Neck opening reaches the top boundary');
  assert(sample(300, 330)[3] > 200, 'Fabric exists below the neck');
  assert(sample(145, 320)[3] > 200 && sample(455, 320)[3] > 200, 'Both short sleeves cover the upper arms');
  assert(sample(124, 500)[3] === 0, 'Lower arms remain outside the garment');

  const { gl, scene, camera, mesh } = view;
  const positions = mesh.geometry.attributes.position;
  const indices = mesh.geometry.index;
  const normalMatrix = new THREE.Matrix3().getNormalMatrix(mesh.modelViewMatrix);
  const sourcePoint = new THREE.Vector3().fromBufferAttribute(positions, 0);
  const projected = sourcePoint.clone().applyMatrix4(mesh.matrixWorld).project(camera);
  assert(Math.abs((projected.x + 1) * 300 - sourcePoint.x) < .001 && Math.abs((1 - projected.y) * 400 - sourcePoint.y) < .001, 'Actual renderer camera preserves source-pixel registration');
  assert(camera.projectionMatrix.elements[0] > 0 && camera.projectionMatrix.elements[5] > 0, 'Actual renderer camera does not hide a reflection in projection');
  let frontTriangle;
  for (let i = 0; i < indices.count && !frontTriangle; i += 3) {
    const points = [0, 1, 2].map((j) => new THREE.Vector3().fromBufferAttribute(positions, indices.getX(i + j)));
    const outward = new THREE.Vector3().crossVectors(points[1].clone().sub(points[0]), points[2].clone().sub(points[0])).normalize();
    if (outward.z > .99) frontTriangle = { points, outward };
  }
  const viewNormal = frontTriangle.outward.applyMatrix3(normalMatrix).normalize();
  const [a, b, c] = frontTriangle.points.map((p) => p.applyMatrix4(mesh.matrixWorld).project(camera));
  const signedArea = (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
  assert(viewNormal.z > .99 && signedArea * Math.sign(mesh.matrixWorld.determinant()) > 0, 'Actual Three projection classifies outward front panels as frontFacing');

  const material = mesh.material;
  const side = material.side;
  const facing = new THREE.ShaderMaterial({
    side: THREE.DoubleSide,
    vertexShader: 'void main() { gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: 'void main() { gl_FragColor = gl_FrontFacing ? vec4(0.0, 1.0, 0.0, 1.0) : vec4(1.0, 0.0, 0.0, 1.0); }',
  });
  const key = scene.children.find((object) => object.isDirectionalLight);
  const hemisphere = scene.children.find((object) => object.isHemisphereLight);
  const keyPosition = key.position.clone();
  const ambientIntensity = hemisphere.intensity;
  try {
    mesh.material = facing;
    gl.render(scene, camera);
    const face = sample(300, 450);
    assert(face[1] > 250 && face[0] < 5, 'WebGL gl_FrontFacing is true on the visible chest');
    mesh.material = material;
    material.side = THREE.FrontSide;
    material.needsUpdate = true;
    gl.render(scene, camera);
    assert(sample(300, 450)[3] > 200, 'WebGL renders the outward chest with back-face culling enabled');
    material.side = side;
    material.needsUpdate = true;
    hemisphere.intensity = 0;
    key.position.set(0, 0, 2);
    gl.render(scene, camera);
    const lit = sample(300, 450);
    key.position.set(0, 0, -2);
    gl.render(scene, camera);
    const unlit = sample(300, 450);
    assert(lit[3] > 200 && unlit[3] > 200 && lit[2] > unlit[2] + 30, `Navy fabric receives front light rather than inward back light, blue ${lit[2]} versus ${unlit[2]}`);
  } finally {
    mesh.material = material;
    material.side = side;
    material.needsUpdate = true;
    key.position.copy(keyPosition);
    hemisphere.intensity = ambientIntensity;
    facing.dispose();
    gl.render(scene, camera);
  }
  renderer.render({ torso: fitTorso(landmarks, source, { width: 1.2, length: 1, vertical: 0 }) });
  assert(sample(175, 450)[3] > 200 && closed === 0, 'Torso-only redraw updates fit without replacing or closing the source');
  renderer.render({ torso: { kind: 'unavailable' } });
  assert(sample(300, 450)[3] === 0 && base.getContext('2d').getImageData(300, 450, 1, 1).data[0] === 201, 'An invalid edit clears geometry but preserves the frozen source');
  renderer.render({ torso });
  assert(sample(300, 450)[3] > 200 && closed === 0, 'Valid geometry can redraw after an invalid draft');
  renderer.setEnabled(false);
  assert(sample(300, 450)[3] === 0, 'Disabling immediately clears the overlay');
  assert(base.getContext('2d').getImageData(300, 450, 1, 1).data[0] === 201, 'Disabling preserves the current source image');
  renderer.setEnabled(true);
  assert(sample(300, 450)[3] > 200, 'Re-enabling redraws the retained frame');
  renderer.render({ bitmap, torso, mask: { width: 60, height: 80, data: new Uint8Array(4800).fill(2) } });
  assert(sample(145, 380, foreground)[3] > 200, 'Exposed upper-arm skin is foreground below the short sleeve');
  assert(sample(138, 460, foreground)[3] > 200, 'Forearm skin is foreground');
  const restored = sample(138, 460, foreground);
  assert(restored[0] === 255 && restored[1] === 0 && restored[2] === 0, 'Low-resolution alpha preserves full-resolution source RGB');
  assert(sample(300, 450, foreground)[3] === 0, 'Bare torso skin is not restored over the shirt');
  for (const sleeveOpening of [75, 130]) {
    renderer.render({ torso, tailoring: { ...defaultTailoring(), sleeveLength: 75, sleeveOpening } });
    assert(sample(145, 360, foreground)[3] > 200, 'Short tailored sleeves restore exposed distal upper arm');
    renderer.render({ torso, tailoring: { ...defaultTailoring(), sleeveLength: 135, sleeveOpening } });
    assert(sample(145, 360)[3] > 200 && sample(145, 360, foreground)[3] === 0, 'Final long sleeve projection excludes skin for both opening extremes');
    assert(sample(138, 460, foreground)[3] > 200, 'Long sleeve retains distal forearm restoration');
    assert(sample(300, 450, foreground)[3] === 0, 'Tailoring never restores unrelated bare torso');
  }
  const readOnlyTailoring = { ...defaultTailoring(), sleeveLength: 135 };
  renderer.render({ torso, tailoring: readOnlyTailoring });
  readOnlyTailoring.sleeveLength = 75;
  renderer.setEnabled(false);
  renderer.setEnabled(true);
  assert(sample(145, 360, foreground)[3] === 0, 'Renderer retains its own read-only tailoring value');
  renderer.render({ bitmap, torso: { ...torso, head: { x: 145, y: 360 } }, mask: { width: 60, height: 80, data: new Uint8Array(4800).fill(3) } });
  assert(sample(145, 360, foreground)[3] > 200, 'Sleeve exclusion does not erase face categories near the head');
  for (const mode of ['roll', 'cross']) {
    const moved = structuredClone(landmarks);
    if (mode === 'cross') {
      moved[13].x = .6; moved[14].x = .4;
      moved[15].x = .75; moved[16].x = .25;
    } else {
      for (const point of moved) {
        const x = point.x * 600 - 300, y = point.y * 800 - 400;
        point.x = (300 + x * Math.cos(.45) - y * Math.sin(.45)) / 600;
        point.y = (400 + x * Math.sin(.45) + y * Math.cos(.45)) / 800;
      }
    }
    renderer.render({ bitmap, torso: fitTorso(moved, source), tailoring: { ...defaultTailoring(), sleeveLength: 135, sleeveOpening: 130 }, mask: { width: 60, height: 80, data: new Uint8Array(4800).fill(2) } });
    const [x, y] = mode === 'roll' ? [180, 310] : [270, 360];
    assert(sample(x, y)[3] > 200 && sample(x, y, foreground)[3] === 0, `${mode} sleeve excludes skin even where distal corridors cross its projection`);
    assert(sample(300, 450, foreground)[3] === 0, `${mode} does not restore unrelated torso skin`);
  }
  renderer.render({ bitmap, torso, tailoring: defaultTailoring(), mask: { width: 60, height: 80, data: new Uint8Array(4800).fill(2) } });
  renderer.setSegmentation(false);
  assert(sample(138, 460, foreground)[3] === 0, 'Disabling segmentation immediately clears foreground pixels');
  renderer.setSegmentation(true);
  assert(sample(138, 460, foreground)[3] === 0, 'Re-enabling segmentation does not restore an old mask');
  assert(closed === 0 && bitmap.width === 600, 'Redraws do not close the retained bitmap');
  renderer.render({ bitmap, torso });
  assert(closed === 0, 'Rendering the same bitmap does not close it');

  const next = await createImageBitmap(source);
  renderer.render({ bitmap: next, torso: { kind: 'unavailable', reason: 'No pose' } });
  assert(closed === 1 && next.width === 0, 'Unavailable tracking releases both old and incoming bitmaps');
  assert(sample(300, 450)[3] === 0, 'No pose clears stale garment pixels');
  assert(base.getContext('2d').getImageData(300, 450, 1, 1).data[0] !== 201, 'No pose clears the source image to neutral');

  for (const shift of [-1.6, 0, 1.6, 0]) {
    const moved = landmarks.map((point) => ({ ...point, x: point.x + shift }));
    renderer.render({ bitmap: await createImageBitmap(source), torso: fitTorso(moved, source) });
    if (shift === 0) assert(sample(300, 450)[3] > 200, 'The deformed mesh returns from offscreen without stale-bound culling');
  }
  renderer.clear();
  renderer.setEnabled(false);
  renderer.setSegmentation(false);
  assert(sample(300, 450)[3] === 0, 'Clear followed by toggles stays neutral');
  const finalBitmap = await createImageBitmap(source);
  renderer.render({ bitmap: finalBitmap, torso });
  renderer.dispose();
  assert(finalBitmap.width === 0, 'Disposal releases the retained source bitmap');
  renderer.dispose();
  assert(true, 'Disposal is idempotent');
  const lateBitmap = await createImageBitmap(source);
  renderer.render({ bitmap: lateBitmap, torso });
  assert(lateBitmap.width === 0, 'Late frames after disposal are released');
  renderer = undefined;

  let contextError;
  try {
    createRenderer({ base: { getContext: () => null }, garment: canvas(), foreground: canvas() });
  } catch (error) { contextError = error.message; }
  assert(/2D.*canvas/i.test(contextError), 'Missing canvas contexts have an actionable error');
  results.textContent = `PASS ${checks.length} renderer checks\n${checks.join('\n')}`;
  document.documentElement.dataset.result = 'pass';
} catch (error) {
  results.textContent = `FAIL after ${checks.length} checks\n${error.stack}`;
  document.documentElement.dataset.result = 'fail';
} finally {
  renderer?.dispose();
}
</script>
</body>
</html>
